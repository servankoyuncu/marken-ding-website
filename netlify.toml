# MarkenDing — Netlify Configuration

[build]
  publish = "."

# Redirect www to non-www (or vice versa)
[[redirects]]
  from = "https://www.marken-ding.com/*"
  to = "https://marken-ding.com/:splat"
  status = 301
  force = true

# Short links for the referral program (not linked anywhere on the site)
[[redirects]]
  from = "/empfehlung"
  to = "/pages/empfehlung.html"
  status = 200

[[redirects]]
  from = "/partner"
  to = "/pages/partner.html"
  status = 200

# Custom headers
[[headers]]
  for = "/empfehlung"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/partner"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pages/empfehlung*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pages/partner*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
